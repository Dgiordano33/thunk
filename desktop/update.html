<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self'">
  <title>Updating Thunk</title>
  <style>
    /* Space palette mirrors app/globals.css; this standalone window has no app stylesheet. */
    :root {
      color-scheme: light dark;
      --sky-top: oklch(0.962 0.022 250); --sky-bot: oklch(0.972 0.032 330);
      --ink: oklch(0.16 0.015 260); --muted: oklch(0.45 0.02 255);
      --orbit: oklch(0.3 0.08 265 / 42%); --star: oklch(0.62 0.15 70);
      --line: rgb(0 0 0 / 13%); --glass: rgb(255 255 255 / 55%);
      --ring: oklch(0.5 0.14 245);
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: linear-gradient(155deg, var(--sky-top), var(--sky-bot)); color: var(--ink); font: 14px/1.5 -apple-system, BlinkMacSystemFont, sans-serif; }
    .titlebar { height: 44px; -webkit-app-region: drag; }
    main { padding: 8px 32px 28px; text-align: center; }
    .orbit-mark { width: 76px; height: 76px; margin: 0 auto 22px; }
    svg { display: block; width: 100%; height: 100%; overflow: visible; }
    .orbit { stroke: var(--orbit); }
    .star { stroke: var(--star); }
    .satellite { transform-origin: 38px 38px; animation: orbit 12s linear infinite; }
    h1 { margin: 0 0 8px; font-size: 20px; font-weight: 600; letter-spacing: -.4px; }
    p { margin: 0; color: var(--muted); }
    .hint { margin-top: 24px; padding-top: 16px; border-top: 1px solid var(--line); font-size: 12px; }
    button { margin-top: 16px; padding: 7px 14px; border: 1px solid var(--line); border-radius: 8px; background: var(--glass); color: var(--ink); font: inherit; font-size: 12px; cursor: pointer; transition: background 150ms ease; }
    button:hover { background: color-mix(in srgb, var(--ink) 6%, var(--glass)); }
    button:active { background: color-mix(in srgb, var(--ink) 10%, var(--glass)); }
    button:focus-visible { outline: 2px solid var(--ring); outline-offset: 3px; }
    @keyframes orbit { to { transform: rotate(360deg); } }
    @media (prefers-color-scheme: dark) {
      :root {
        --sky-top: oklch(0.14 0.055 265); --sky-bot: oklch(0.215 0.1 302);
        --ink: oklch(0.97 0.005 250); --muted: oklch(0.72 0.02 255);
        --orbit: oklch(0.82 0.06 250 / 42%); --star: oklch(0.93 0.11 95);
        --line: rgb(255 255 255 / 13%); --glass: rgb(255 255 255 / 5%);
        --ring: oklch(0.78 0.11 235);
      }
    }
    @media (prefers-reduced-motion: reduce) { .satellite { animation: none; } button { transition: none; } }
  </style>
</head>
<body>
  <div class="titlebar" aria-hidden="true"></div>
  <main aria-labelledby="heading">
    <div class="orbit-mark" aria-hidden="true">
      <svg viewBox="0 0 76 76" fill="none" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
        <circle class="orbit" cx="38" cy="38" r="30" stroke-dasharray="1 5"/>
        <ellipse class="orbit" cx="38" cy="38" rx="34" ry="14" transform="rotate(-30 38 38)"/>
        <path class="star" d="M38 25c0 9-4 13-13 13 9 0 13 4 13 13 0-9 4-13 13-13-9 0-13-4-13-13Z"/>
        <g class="satellite"><circle cx="38" cy="8" r="3" fill="var(--sky-top)" stroke="var(--ink)"/></g>
      </svg>
    </div>
    <div role="status" aria-live="polite" aria-atomic="true">
      <h1 id="heading">A little refresh for Thunk</h1>
      <p id="status">Checking for updates…</p>
    </div>
    <p class="hint">This can take a few minutes.<br>We’ll ask before restarting.</p>
    <button type="button" id="background" autofocus>Continue working</button>
  </main>
  <script src="update.js"></script>
</body>
</html>
