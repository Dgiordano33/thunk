name: Desktop release
on:
  push:
    tags: ['v*']
  # Build and smoke-test every platform when packaging changes, so a tag is not the first test.
  pull_request:
    paths: ['desktop/**', 'scripts/**', '.github/workflows/desktop-release.yml']
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
          - runner: ubuntu-24.04
            arch: x64
          - runner: ubuntu-24.04-arm
            arch: arm64
          - runner: windows-2025
            arch: x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Verify release version and architecture
        shell: bash
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          node -e 'const assert = require("node:assert/strict"); assert.equal(process.arch, process.env.EXPECTED_ARCH); if (process.env.GITHUB_REF_TYPE === "tag") assert.equal(process.env.GITHUB_REF_NAME, "v" + require("./desktop/package.json").version)'
      - run: npm ci
      - run: npm run test:desktop
      # Windows has no system Git, so bundle MinGit from the official Git for Windows release.
      - name: Download MinGit
        if: runner.os == 'Windows'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo git-for-windows/git --pattern 'MinGit-*-64-bit.zip' --dir mingit-zip
          zip=$(ls mingit-zip/MinGit-*-64-bit.zip | grep -v busybox | head -1)
          mkdir mingit && unzip -q "$zip" -d mingit
          echo "THUNK_MINGIT_DIR=$PWD/mingit" >> "$GITHUB_ENV"
      - run: npm run desktop:release
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ runner.os }}-${{ matrix.arch }}
          path: |
            dist-desktop/*.zip
            dist-desktop/*.tar.gz
            dist-desktop/*.sha256
          if-no-files-found: error
  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          merge-multiple: true
          path: artifacts
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" artifacts/* --verify-tag --draft --title "Thunk $RELEASE_TAG" --notes 'macOS: download the Apple-Silicon ZIP for M-series Macs, or Intel for older Macs. Unzip, move Thunk to Applications, and open it; this build is ad-hoc signed, so macOS may require approval in Privacy & Security. Windows: unzip Windows-x64 anywhere and run Thunk.exe; SmartScreen may ask you to confirm because the build is unsigned. Git is included. Linux: extract the Linux-x64 or Linux-ARM64 archive and run ./thunk; install Git with your package manager. Connect an agent in Thunk → Connections. For updates, quit Thunk before replacing the app. Data stays in place.'
